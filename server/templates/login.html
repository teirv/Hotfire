{% extends "base.html" %}{% block title %}Sign in to Hotfire{% endblock %}{% block body %}
<h1>Sign in</h1>{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post"><label>Username<input name="username" autocomplete="username" autocapitalize="off" required value="{{ username or '' }}"></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<p class="muted">Hotfire is invite only. Ask the owner for a sign-up link.</p>{% endblock %}
