{% extends "base.html" %}{% block title %}Join Hotfire{% endblock %}{% block body %}
<h1>Create your account</h1>
{% if not valid %}<p class="err" role="alert">This invite isn't valid. It may be used or expired, so ask for a new one.</p>
{% else %}{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="code" value="{{ code }}">
<label>Username<input name="username" autocomplete="username" autocapitalize="off" required value="{{ username or '' }}"></label>
<label>Password (at least 10 characters)<input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
<label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label><button>Create account</button></form>{% endif %}{% endblock %}
